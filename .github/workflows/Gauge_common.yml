name: Gauge common
on: [push, pull_request]
jobs:

  build:
    name: Run test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test ./...
